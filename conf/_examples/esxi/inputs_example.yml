# ESXi Variables Template
# Copy this file to inputs.yml and populate with your environment-specific values.
# ==================================================================

esxiBuildNumber: '<YOUR_TARGET_ESXI_BUILD_NUMBER>'  # e.g., '25595708'
classification: "U"
MARKING: "<YOUR_DATA_MARKING>" # e.g., 'CUI', 'FOUO', etc.
adJoined: true

esxiNtpServers: 
  - "<NTP_SERVER_IP_1>"
  - "<NTP_SERVER_IP_2>"
  - "<NTP_SERVER_IP_3>"

syslogServer: 'tcp://<SYSLOG_SERVER_FQDN_OR_IP>:<PORT>'

adAdminGroup: "<YOUR_AD_ADMIN_GROUP>"

allowedIPs: 
  - "<ALLOWED_SUBNET_1>/16"
  - "<ALLOWED_SUBNET_2>/16"
  - "<ALLOWED_SUBNET_3>/16"

exceptionUsers:
  - '<DOMAIN>\svc.<YOUR_SERVICE_ACCOUNT>'
  - 'root'

domainName: '<YOUR_DOMAIN_NAME>' # e.g., 'example.local'

CanonicalOU: '<YOUR_DOMAIN>/<OU_PATH_1>/<OU_PATH_2>'
OU: 'OU=<TARGET_OU>,OU=<PARENT_OU>,DC=<DOMAIN_COMPONENT>,DC=<DOMAIN_COMPONENT>'

vMotionVlanId: '<VLAN_ID_1>, <VLAN_ID_2>'
nfsVlanId: '<NFS_VLAN_ID>'
vsanVlanId: '<VSAN_VLAN_ID>'

mgtVlanId: "unset"    # Checking the vlan isn't necessary to the finding statements.
nativeVLAN: "1"

certificateIssuerOrg: '<YOUR_CERTIFICATE_ISSUER_ORG>'

Scratch: '[<DATASTORE_NAME>] ' # Ensure trailing space is retained if required by logic
snmpEnabled: 'false'